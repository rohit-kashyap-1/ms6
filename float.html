<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .item{
            width: 100px;
            height: 100px;
            border: 1px solid red;
        }
        .item:nth-child(1){
            background-color: orange;
        }
        .item:nth-child(2){
            background-color: darkolivegreen;
        }
        .item:nth-child(1){
            float: left;
        }
        p{
            clear:both
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="item">

        </div>
        
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Error ullam in possimus labore provident fugit neque, nesciunt asperiores dolorum laborum porro animi voluptatibus, facere non, quaerat voluptate ipsam assumenda? Blanditiis!</p>
    </div>
    
</body>
</html>
